# /etc/turnserver.conf for coturn. Open UDP+TCP 3478 and UDP 49160-49200.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=SAME_VALUE_AS_TURN_SECRET
realm=iobeacons.com
min-port=49160
max-port=49200
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
