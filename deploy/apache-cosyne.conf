# Apache alternative (needs: a2enmod proxy proxy_http proxy_wstunnel rewrite headers)
# Add inside the iobeacons.com <VirtualHost *:443> block.
RedirectMatch 301 ^/cosyne$ /cosyne/
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/cosyne/(.*) ws://127.0.0.1:3100/$1 [P,L]
ProxyPass        /cosyne/ http://127.0.0.1:3100/
ProxyPassReverse /cosyne/ http://127.0.0.1:3100/
RequestHeader set X-Forwarded-Proto "https"
