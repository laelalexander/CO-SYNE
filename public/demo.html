<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CO-SYNE Demo View</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/theme.css">
  <style>
    html, body { height: 100%; } body { display: flex; flex-direction: column; overflow: hidden; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .panes { flex: 1; display: grid; grid-template-columns: 430px 1.5fr 1.2fr; gap: 1px; background: var(--line); min-height: 0; }
    .pane { display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
    .pane > header { padding: 6px 12px; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); display: flex; justify-content: space-between; }
    iframe { flex: 1; border: 0; width: 100%; }
  </style>
</head>
<body>
  <div class="bar"><img src="icon.svg" width="26" height="26" alt=""><b>CO-SYNE</b><span class="muted small">Side-by-side demo. Each pane is a separate app with its own identity, the same as on separate devices.</span><span style="flex:1"></span><a class="btn sm" href="./">All apps</a></div>
  <div class="panes">
    <section class="pane"><header><span>Driver's phone</span><a href="driver/" target="_blank" rel="noopener">open alone</a></header><iframe src="driver/" title="Driver" allow="camera; microphone; geolocation; autoplay"></iframe></section>
    <section class="pane"><header><span>Officer terminal</span><a href="officer/" target="_blank" rel="noopener">open alone</a></header><iframe src="officer/" title="Officer" allow="camera; microphone; geolocation; autoplay"></iframe></section>
    <section class="pane"><header><span>Dispatch</span><a href="dispatch/" target="_blank" rel="noopener">open alone</a></header><iframe src="dispatch/" title="Dispatch" allow="camera; microphone; autoplay"></iframe></section>
  </div>
</body>
</html>
