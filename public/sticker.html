<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CO-SYNE Stickers</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --brand: #b48d33; --ink: #15171b; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef1f4; color: var(--ink); }
    header.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #dde3e9; flex-wrap: wrap; }
    header.bar button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
    main { padding: 16px; display: grid; gap: 24px; max-width: 1100px; margin: 0 auto; }
    .set { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #dde3e9; }
    .set h2 { margin: 0 0 12px; font-size: 1rem; }
    .stickers { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    /* Bumper sticker: 11.5in x 3in */
    .bumper { width: 690px; max-width: 100%; aspect-ratio: 11.5 / 3; border-radius: 18px; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 18px; padding: 14px 18px; position: relative; overflow: hidden; }
    .bumper::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(224, 193, 113, .12); }
    .bumper .qr { background: #fff; border-radius: 10px; padding: 6px; height: 100%; aspect-ratio: 1; flex: 0 0 auto; }
    .bumper .qr img { width: 100%; height: 100%; display: block; }
    .bumper .brand { font-weight: 800; font-size: 1.7rem; letter-spacing: .02em; }
    .bumper .brand span { color: #e0c171; }
    .bumper .line { font-size: .95rem; opacity: .9; }
    .bumper .code { font-family: ui-monospace, monospace; font-size: .8rem; opacity: .7; margin-top: 4px; }
    /* Window cling: 4in x 4in */
    .window { width: 260px; aspect-ratio: 1; border-radius: 16px; border: 6px solid var(--brand); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; text-align: center; }
    .window img { width: 70%; }
    .window b { font-size: 1rem; }
    .window small { font-size: .72rem; color: #445; }
    .notice { font-size: .85rem; color: #556; }
    @media print {
      header.bar, .notice { display: none; }
      body { background: #fff; }
      .set { border: 0; break-inside: avoid; padding: 0 0 20px; }
      .bumper, .window { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <strong>CO-SYNE vehicle stickers</strong>
    <span class="notice">Bumper sticker (11.5 × 3 in) and rear-window cling (4 × 4 in). The QR holds only a sticker link, never personal data.</span>
    <button onclick="print()">Print</button>
  </header>
  <main id="sheet"><p>Loading…</p></main>
  <script type="module">
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const id = new URL(location.href).searchParams.get('id');
    const sheet = document.getElementById('sheet');
    async function stickerInfo(stickerId) {
      const r = await fetch(`api/stickers/${encodeURIComponent(stickerId)}`);
      return r.ok ? r.json() : null;
    }
    function render(st, label) {
      const qr = `api/stickers/${encodeURIComponent(st.stickerId)}/qr.svg`;
      return `<section class="set"><h2>${esc(label)} · plate ${esc(st.plate)} ${esc(st.state ?? '')}</h2><div class="stickers">
        <div class="bumper"><div class="qr"><img src="${qr}" alt="CO-SYNE QR code"></div>
          <div><div class="brand">CO-<span>SYNE</span> VERIFIED</div>
          <div class="line">Officers: scan from your patrol car.</div>
          <div class="line">Driver stays in the car · identity verified both ways</div>
          <div class="code">STICKER ${esc(st.code)} · D2ES</div></div></div>
        <div class="window"><img src="${qr}" alt="CO-SYNE QR code"><b>CO-SYNE VERIFIED STOP</b><small>Scan from patrol vehicle · ${esc(st.code)}</small></div>
      </div></section>`;
    }
    (async () => {
      if (id) {
        const st = await stickerInfo(id);
        sheet.innerHTML = st ? render(st, 'Your sticker') : '<p>Sticker not found.</p>';
        return;
      }
      const r = await fetch('api/samples');
      if (!r.ok) { sheet.innerHTML = '<p>No sample data on this server. Open your sticker from the driver app.</p>'; return; }
      const { drivers } = await r.json();
      const parts = await Promise.all(drivers.map(async (d) => {
        const st = await stickerInfo(d.stickerId);
        const v = d.credential.subject.vehicle;
        return st ? render(st, `${d.credential.subject.name} · ${v.year} ${v.make} ${v.model}`) : '';
      }));
      sheet.innerHTML = parts.join('');
    })();
  </script>
</body>
</html>
